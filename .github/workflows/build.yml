name: Build Windows

run-name: >
  ${{ fromJSON('{"Windows 10 22H2":"W10","Windows 11 23H2":"W11","Windows 11 24H2":"W11","Windows 11 24H2 BETA":"W11B","Windows 11 25H2":"W11","Windows BETA":"W11B","Windows 11 26H1":"W11","Windows 11 26H2":"W11","Windows DEV":"W11D","Windows CANARY":"W11C"}')[inputs.versions] }}
  ${{ fromJSON('{"Pro":"PRO","Home":"HOME","Multi":"MULTI"}')[inputs.edition] }}
  ${{ fromJSON('{"x64":"X64","arm64":"ARM64"}')[inputs.architecture] }}
  ${{ fromJSON('{
    "Arabic (Saudi Arabia)":"AR","Bulgarian (Bulgaria)":"BG","Czech (Czech Republic)":"CS","Danish (Denmark)":"DA","German (Germany)":"DE","Greek (Greece)":"EL",
    "English (United Kingdom)":"EN","English (United States)":"EN","Spanish (Spain)":"ES","Spanish (Mexico)":"ES","Estonian (Estonia)":"ET","Finnish (Finland)":"FI",
    "French (Canada)":"FR","French (France)":"FR","Hebrew (Israel)":"HE","Croatian (Croatia)":"HR","Hungarian (Hungary)":"HU","Italian (Italy)":"IT",
    "Japanese (Japan)":"JA","Korean (Korea)":"KO","Lithuanian (Lithuania)":"LT","Latvian (Latvia)":"LV","Norwegian Bokmål (Norway)":"NB",
    "Dutch (Netherlands)":"NL","Polish (Poland)":"PL","Portuguese (Brazil)":"PT","Portuguese (Portugal)":"PT","Romanian (Romania)":"RO","Russian (Russia)":"RU",
    "Slovak (Slovakia)":"SK","Slovenian (Slovenia)":"SL","Serbian (Latin, Serbia)":"SR","Swedish (Sweden)":"SV","Thai (Thailand)":"TH","Turkish (Turkey)":"TR",
    "Ukrainian (Ukraine)":"UK","Chinese (Simplified, China)":"ZH","Chinese (Traditional, Taiwan)":"ZH"
  }')[inputs.language] }}
  ${{ inputs.esd && 'ESD' || '' }}
  ${{ inputs.drivers && 'DRIVERS' || '' }}
  ${{ inputs.netfx3 && 'NETFX3' || '' }}

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: "Windows architecture to build"
        type: choice
        options: [x64, arm64]
        default: x64
        required: true
      versions:
        description: "Windows version to build"
        type: choice
        options:
          - Windows 10 22H2
          - Windows 11 23H2
          - Windows 11 24H2
          - Windows 11 24H2 BETA
          - Windows 11 25H2
          - Windows 11 26H1
          - Windows 11 26H2
          - Windows BETA
          - Windows DEV
          - Windows CANARY
        default: Windows 11 25H2
        required: true
      edition:
        description: "Windows edition to build"
        type: choice
        options: [Pro, Home, Multi]
        default: Pro
        required: true
      language:
        description: "Language"
        type: choice
        options:
          - Arabic (Saudi Arabia)
          - Bulgarian (Bulgaria)
          - Czech (Czech Republic)
          - Danish (Denmark)
          - German (Germany)
          - Greek (Greece)
          - English (United Kingdom)
          - English (United States)
          - Spanish (Spain)
          - Spanish (Mexico)
          - Estonian (Estonia)
          - Finnish (Finland)
          - French (Canada)
          - French (France)
          - Hebrew (Israel)
          - Croatian (Croatia)
          - Hungarian (Hungary)
          - Italian (Italy)
          - Japanese (Japan)
          - Korean (Korea)
          - Lithuanian (Lithuania)
          - Latvian (Latvia)
          - Norwegian Bokmål (Norway)
          - Dutch (Netherlands)
          - Polish (Poland)
          - Portuguese (Brazil)
          - Portuguese (Portugal)
          - Romanian (Romania)
          - Russian (Russia)
          - Slovak (Slovakia)
          - Slovenian (Slovenia)
          - Serbian (Latin, Serbia)
          - Swedish (Sweden)
          - Thai (Thailand)
          - Turkish (Turkey)
          - Ukrainian (Ukraine)
          - Chinese (Simplified, China)
          - Chinese (Traditional, Taiwan)
        default: Chinese (Simplified, China)
        required: true
      revision:
        description: "Revision number (optional)"
        type: string
        required: false
      esd:
        description: "Use ESD compression"
        type: boolean
        required: true
        default: false
      netfx3:
        description: "Add .NET Framework 3.5"
        type: boolean
        required: true
        default: false
      drivers:
        description: "Add additional drivers (only for x64)"
        type: boolean
        required: true
        default: false
      upload_gofile:
        description: "Upload to Gofile"
        type: boolean
        required: true
        default: true
      upload_pixeldrain:
        description: "Upload to Pixeldrain"
        type: boolean
        required: true
        default: false
      upload_buzzheavier:
        description: "Upload to Buzzheavier"
        type: boolean
        required: true
        default: true
      upload_quark:
        description: "Upload to Quark"
        type: boolean
        required: true
        default: true
      upload_c189:
        description: "Upload to Cloud189 (天翼云盘)"
        type: boolean
        required: true
        default: true

permissions:
  contents: write

env:
  # cloud189 CLI 的源码位置, 必须包含 link 子命令与 up --json (本仓库定制版)
  # 私有仓库可用 secrets.C189_REPO 覆盖, 形如 https://<token>@github.com/<owner>/cloud189.git
  C189_REPO: "https://github.com/ylx2016/cloud189.git"
  C189_REF: "main"
  # ISO 在天翼云盘上的目录
  C189_DIR: "/Win11"

jobs:
  build:
    runs-on: ${{ fromJSON('{"x64":"windows-2025","arm64":"windows-11-arm"}')[inputs.architecture] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Map inputs
        id: map
        shell: pwsh
        run: |
          $langMap = @{
            'Arabic (Saudi Arabia)'='ar-sa'
            'Bulgarian (Bulgaria)'='bg-bg'
            'Czech (Czech Republic)'='cs-cz'
            'Danish (Denmark)'='da-dk'
            'German (Germany)'='de-de'
            'Greek (Greece)'='el-gr'
            'English (United Kingdom)'='en-gb'
            'English (United States)'='en-us'
            'Spanish (Spain)'='es-es'
            'Spanish (Mexico)'='es-mx'
            'Estonian (Estonia)'='et-ee'
            'Finnish (Finland)'='fi-fi'
            'French (Canada)'='fr-ca'
            'French (France)'='fr-fr'
            'Hebrew (Israel)'='he-il'
            'Croatian (Croatia)'='hr-hr'
            'Hungarian (Hungary)'='hu-hu'
            'Italian (Italy)'='it-it'
            'Japanese (Japan)'='ja-jp'
            'Korean (Korea)'='ko-kr'
            'Lithuanian (Lithuania)'='lt-lt'
            'Latvian (Latvia)'='lv-lv'
            'Norwegian Bokmål (Norway)'='nb-no'
            'Dutch (Netherlands)'='nl-nl'
            'Polish (Poland)'='pl-pl'
            'Portuguese (Brazil)'='pt-br'
            'Portuguese (Portugal)'='pt-pt'
            'Romanian (Romania)'='ro-ro'
            'Russian (Russia)'='ru-ru'
            'Slovak (Slovakia)'='sk-sk'
            'Slovenian (Slovenia)'='sl-si'
            'Serbian (Latin, Serbia)'='sr-latn-rs'
            'Swedish (Sweden)'='sv-se'
            'Thai (Thailand)'='th-th'
            'Turkish (Turkey)'='tr-tr'
            'Ukrainian (Ukraine)'='uk-ua'
            'Chinese (Simplified, China)'='zh-cn'
            'Chinese (Traditional, Taiwan)'='zh-tw'
          }

          $verMap = @{
            'Windows 10 22H2'      = 'windows-10'
            'Windows 11 23H2'      = 'windows-11old'
            'Windows 11 24H2'      = 'windows-11'
            'Windows 11 24H2 BETA' = 'windows-11beta'
            'Windows 11 25H2'      = 'windows-11new'
            'Windows BETA'         = 'windows-11beta'
            'Windows 11 26H1'      = 'windows-1126h1'
            'Windows 11 26H2'      = 'windows-1126h2'
            'Windows DEV'          = 'windows-dev'
            'Windows CANARY'       = 'windows-canary'
          }

          $langCode = $langMap['${{ inputs.language }}']
          $verCode  = $verMap['${{ inputs.versions }}']

          $opts = ''
          if ('${{ inputs.esd }}' -eq 'true') { $opts += ' -esd' }
          if (('${{ inputs.drivers }}' -eq 'true') -and ('${{ inputs.architecture }}' -ne 'arm64')) { $opts += ' -drivers' }
          if ('${{ inputs.netfx3 }}' -eq 'true') { $opts += ' -netfx3' }
          if (-not [string]::IsNullOrWhiteSpace('${{ inputs.revision }}')) {
            if ('${{ inputs.revision }}' -notmatch '^[0-9]+(\.[0-9]+)*$') {
              throw "Invalid revision '${{ inputs.revision }}': only digits and dots are allowed."
            }
            $opts += ' -revision "${{ inputs.revision }}"'
          }
          $opts = $opts.Trim()

          echo "lang=$langCode" >> $env:GITHUB_OUTPUT
          echo "version=$verCode" >> $env:GITHUB_OUTPUT
          if ($opts) { echo "options=$opts" >> $env:GITHUB_OUTPUT }

      - name: Build Windows
        id: build_windows
        shell: pwsh
        run: |
          pwsh uup-dump-get-windows-iso.ps1 ${{ steps.map.outputs.version }} ${{ inputs.architecture == 'arm64' && 'c:/output' || 'd:/output' }} -architecture ${{ inputs.architecture }} -edition ${{ inputs.edition }} -lang ${{ steps.map.outputs.lang }} ${{ steps.map.outputs.options }}

      - name: Upload to Gofile
        id: upload_gofile
        if: ${{ inputs.upload_gofile == true }}
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $outputDir = "${{ inputs.architecture == 'arm64' && 'C:/output' || 'D:/output' }}"
          $isoFile = Get-ChildItem -Path $outputDir -Filter "*.ISO" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $isoFile) {
            Write-Warning "Gofile: ISO file not found."
            echo "GOFILE_LINK=" >> $env:GITHUB_ENV
            return
          }

          try {
            $uri = "https://upload.gofile.io/contents/uploadfile"
            $r = Invoke-RestMethod -Uri $uri -Method Post -Form @{ file = $isoFile } -ErrorAction Stop
            if ($r.status -ne 'ok') { throw "status=$($r.status)" }
            echo "GOFILE_LINK=$($r.data.downloadPage)" >> $env:GITHUB_ENV
          } catch {
            Write-Warning "Gofile upload failed: $_"
            echo "GOFILE_LINK=" >> $env:GITHUB_ENV
          }

      - name: Upload to Pixeldrain
        id: upload_pixeldrain
        if: ${{ inputs.upload_pixeldrain == true }}
        shell: pwsh
        continue-on-error: true
        env:
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          $ErrorActionPreference = 'Continue'
          $outputDir = "${{ inputs.architecture == 'arm64' && 'C:/output' || 'D:/output' }}"
          $isoFile = Get-ChildItem -Path $outputDir -Filter "*.ISO" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $isoFile) {
            Write-Warning "Pixeldrain: ISO file not found."
            echo "PIXELDRAIN_LINK=" >> $env:GITHUB_ENV
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:PIXELDRAIN_API_KEY)) {
            Write-Warning "Pixeldrain API key is empty."
            echo "PIXELDRAIN_LINK=" >> $env:GITHUB_ENV
            exit 0
          }

          try {
            $base64 = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes(":$env:PIXELDRAIN_API_KEY"))
            $headers = @{ Authorization = "Basic $base64" }
            $uri = "https://pixeldrain.com/api/file/$([Uri]::EscapeDataString($isoFile.Name))"
            $r = Invoke-RestMethod -Uri $uri -Method Put -Headers $headers -InFile $isoFile.FullName -ContentType 'application/octet-stream' -ErrorAction Stop
            if (-not $r.id) { throw "no id in response: $($r | ConvertTo-Json -Compress)" }
            echo "PIXELDRAIN_LINK=https://pixeldrain.com/u/$($r.id)" >> $env:GITHUB_ENV
          } catch {
            Write-Warning "Pixeldrain upload failed: $_"
            echo "PIXELDRAIN_LINK=" >> $env:GITHUB_ENV
          }

      - name: Upload to Buzzheavier
        id: upload_buzzheavier
        if: ${{ inputs.upload_buzzheavier == true }}
        shell: pwsh
        continue-on-error: true
        env:
          BUZZHEAVIER_API_KEY: ${{ secrets.BUZZHEAVIER_API_KEY }}
          BUZZHEAVIER_FOLDER_ID: ${{ secrets.BUZZHEAVIER_FOLDER_ID }}
          BUZZHEAVIER_LOCATION_ID: "12brteedoy0f"
        run: |
          $ErrorActionPreference = 'Continue'
          $outputDir = "${{ inputs.architecture == 'arm64' && 'C:/output' || 'D:/output' }}"
          $isoFile = Get-ChildItem -Path $outputDir -Filter "*.ISO" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $isoFile) {
            Write-Warning "Buzzheavier: ISO file not found."
            echo "BUZZHEAVIER_LINK=" >> $env:GITHUB_ENV
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:BUZZHEAVIER_API_KEY)) {
            Write-Warning "Buzzheavier API key is empty."
            echo "BUZZHEAVIER_LINK=" >> $env:GITHUB_ENV
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:BUZZHEAVIER_FOLDER_ID)) {
            Write-Warning "Buzzheavier folder id is empty."
            echo "BUZZHEAVIER_LINK=" >> $env:GITHUB_ENV
            exit 0
          }

          try {
            $uri = "https://w.buzzheavier.com/$($env:BUZZHEAVIER_FOLDER_ID)/$([Uri]::EscapeDataString($isoFile.Name))?locationId=$($env:BUZZHEAVIER_LOCATION_ID)"
            $headers = @{ Authorization = "Bearer $env:BUZZHEAVIER_API_KEY" }
            $r = Invoke-RestMethod -Uri $uri -Method Put -Headers $headers -InFile $isoFile.FullName -ContentType 'application/octet-stream' -ErrorAction Stop
            $fileId = $null
            if ($r.id) { $fileId = $r.id } elseif ($r.data -and $r.data.id) { $fileId = $r.data.id }
            if (-not $fileId) { throw "no id in response: $($r | ConvertTo-Json -Compress)" }
            echo "BUZZHEAVIER_LINK=https://buzzheavier.com/$fileId" >> $env:GITHUB_ENV
          } catch {
            Write-Warning "Buzzheavier upload failed: $_"
            echo "BUZZHEAVIER_LINK=" >> $env:GITHUB_ENV
          }

      - name: Setup Quark CLI
        if: ${{ inputs.upload_quark == true }}
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $url = "https://github.com/zhangjingwei/kuake_cli/releases/download/v1.5.0/kuake-v1.5.0-windows-amd64.exe"
          $dest = "$env:RUNNER_TEMP\kuake.exe"
          Invoke-WebRequest -Uri $url -OutFile $dest
          $bytes = [System.IO.File]::ReadAllBytes($dest)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "Downloaded file is not a valid Windows executable."
          }
          echo "$env:RUNNER_TEMP" >> $env:GITHUB_PATH

      - name: Upload to Quark
        id: upload_quark
        if: ${{ inputs.upload_quark == true }}
        shell: pwsh
        continue-on-error: true
        env:
          KUAKE_COOKIE: ${{ secrets.KUAKE_COOKIE }}
          KUAKE_PUS: ${{ secrets.KUAKE_PUS }}
          KUAKE_PUUS: ${{ secrets.KUAKE_PUUS }}
          KUAKE_UPLOAD_PARALLEL: "16"
        run: |
          $ErrorActionPreference = 'Continue'
          $outputDir = "${{ inputs.architecture == 'arm64' && 'C:/output' || 'D:/output' }}"
          $isoFile = Get-ChildItem -Path $outputDir -Filter "*.ISO" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $isoFile) {
            Write-Warning "Quark: ISO file not found."
            echo "QUARK_LINK=" >> $env:GITHUB_ENV
            exit 0
          }
          $hasCookie = -not [string]::IsNullOrWhiteSpace($env:KUAKE_COOKIE)
          $hasSplit = (-not [string]::IsNullOrWhiteSpace($env:KUAKE_PUS)) -and (-not [string]::IsNullOrWhiteSpace($env:KUAKE_PUUS))
          if (-not $hasCookie -and -not $hasSplit) {
            Write-Warning "Quark credentials are empty."
            echo "QUARK_LINK=" >> $env:GITHUB_ENV
            exit 0
          }

          try {
            $kuake = "$env:RUNNER_TEMP\kuake.exe"
            if (-not (Test-Path $kuake)) { throw "kuake.exe not found" }
            $remotePath = "/uupiso/$($isoFile.Name)"
            $uploadJson = & $kuake upload "$($isoFile.FullName)" "$remotePath" --max_upload_parallel 16
            if ($LASTEXITCODE -ne 0) { throw "kuake upload failed: $uploadJson" }

            $shareJson = & $kuake share "$remotePath" 7 "false"
            if ($LASTEXITCODE -ne 0) { throw "kuake share failed: $shareJson" }

            $share = $shareJson | ConvertFrom-Json
            $shareLink = $null
            if ($share.success -and $share.data) {
              if ($share.data.share_url) { $shareLink = $share.data.share_url }
              elseif ($share.data.share_link) { $shareLink = $share.data.share_link }
              elseif ($share.data.url) { $shareLink = $share.data.url }
              elseif ($share.data.link) { $shareLink = $share.data.link }
              elseif ($share.data.pwd_id) { $shareLink = "https://pan.quark.cn/s/$($share.data.pwd_id)" }
            }

            if (-not $shareLink) { throw "Quark share link not found: $shareJson" }
            echo "QUARK_LINK=$shareLink" >> $env:GITHUB_ENV
          } catch {
            Write-Warning "Quark upload failed: $_"
            echo "QUARK_LINK=" >> $env:GITHUB_ENV
          }

      - name: Setup Go
        if: ${{ inputs.upload_c189 == true }}
        uses: actions/setup-go@v5
        continue-on-error: true
        with:
          go-version: "1.23"
          cache: false

      - name: Setup cloud189 CLI
        if: ${{ inputs.upload_c189 == true }}
        shell: pwsh
        continue-on-error: true
        env:
          C189_CLI_URL: ${{ secrets.C189_CLI_URL }}
          C189_REPO_OVERRIDE: ${{ secrets.C189_REPO }}
        run: |
          $ErrorActionPreference = 'Continue'
          $dest = "$env:RUNNER_TEMP\cloud189.exe"
          try {
            if (-not [string]::IsNullOrWhiteSpace($env:C189_CLI_URL)) {
              # 有预编译二进制时直接下载, 省去构建; 若下载到的是 zip(GoReleaser 的
              # windows 产物就是 zip), 自动解压并取出里面的 cloud189.exe
              $dl = "$env:RUNNER_TEMP\cloud189-download.bin"
              Remove-Item $dl -Force -ErrorAction SilentlyContinue
              Invoke-WebRequest -Uri $env:C189_CLI_URL -OutFile $dl -ErrorAction Stop
              $sig = [byte[]]::new(2)
              $fs = [System.IO.File]::OpenRead($dl)
              try { $null = $fs.Read($sig, 0, 2) } finally { $fs.Dispose() }
              if ($sig[0] -eq 0x50 -and $sig[1] -eq 0x4B) {
                $zip = "$env:RUNNER_TEMP\cloud189-download.zip"
                $unzip = "$env:RUNNER_TEMP\cloud189-unzip"
                Remove-Item $zip -Force -ErrorAction SilentlyContinue
                Remove-Item $unzip -Recurse -Force -ErrorAction SilentlyContinue
                Move-Item $dl $zip -Force
                Expand-Archive -LiteralPath $zip -DestinationPath $unzip -Force -ErrorAction Stop
                $exe = Get-ChildItem $unzip -Recurse -Filter "cloud189*.exe" | Select-Object -First 1
                if (-not $exe) { throw "zip 里找不到 cloud189.exe" }
                Copy-Item $exe.FullName $dest -Force
              } else {
                Move-Item $dl $dest -Force
              }
            } else {
              $repo = if ([string]::IsNullOrWhiteSpace($env:C189_REPO_OVERRIDE)) { $env:C189_REPO } else { $env:C189_REPO_OVERRIDE }
              $src = "$env:RUNNER_TEMP\cloud189-src"
              Remove-Item $src -Recurse -Force -ErrorAction SilentlyContinue
              git clone --quiet --depth 1 --branch "$env:C189_REF" "$repo" "$src"
              if ($LASTEXITCODE -ne 0) { throw "git clone 失败" }
              $env:CGO_ENABLED = "0"
              Push-Location $src
              try {
                go build -trimpath -ldflags "-s -w" -o $dest ./cmd/cloud189
                if ($LASTEXITCODE -ne 0) { throw "go build 失败" }
              } finally { Pop-Location }
            }
            $bytes = [System.IO.File]::ReadAllBytes($dest)
            if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
              throw "cloud189.exe 不是有效的 Windows 可执行文件"
            }
            # 校验该版本是否具备本工作流需要的能力
            & $dest link --help > $null 2>&1
            if ($LASTEXITCODE -ne 0) { throw "该 cloud189 版本没有 link 子命令(分享), 请把 C189_REPO 指向包含 link 的版本" }
            $upHelp = (& $dest up --help 2>&1) -join "`n"
            if ($upHelp -notmatch '--input') { throw "该 cloud189 版本的 up 不支持 --input/--path" }
            echo "C189_CLI=$dest" >> $env:GITHUB_ENV
            echo "C189_READY=1" >> $env:GITHUB_ENV
          } catch {
            Write-Warning "Cloud189 CLI 准备失败: $_"
            echo "C189_READY=0" >> $env:GITHUB_ENV
          }

      - name: Upload to Cloud189
        id: upload_c189
        if: ${{ inputs.upload_c189 == true }}
        shell: pwsh
        continue-on-error: true
        env:
          # 推荐: 本机执行 cloud189 login/qrlogin 后, 把 config.json 内容(或其 base64)存为该 secret
          C189_CONFIG: ${{ secrets.C189_CONFIG }}
          # 备用: 账号密码。新 IP 首次登录可能触发验证码, 此时请改用 C189_CONFIG
          C189_USERNAME: ${{ secrets.C189_USERNAME }}
          C189_PASSWORD: ${{ secrets.C189_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Continue'
          $outputDir = "${{ inputs.architecture == 'arm64' && 'C:/output' || 'D:/output' }}"
          $isoFile = Get-ChildItem -Path $outputDir -Filter "*.ISO" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $isoFile) {
            Write-Warning "Cloud189: ISO file not found."
            echo "C189_LINK=" >> $env:GITHUB_ENV
            exit 0
          }
          if ($env:C189_READY -ne '1') {
            Write-Warning "Cloud189: CLI 不可用, 跳过上传。"
            echo "C189_LINK=" >> $env:GITHUB_ENV
            exit 0
          }
          $hasConfig = -not [string]::IsNullOrWhiteSpace($env:C189_CONFIG)
          $hasPwd = (-not [string]::IsNullOrWhiteSpace($env:C189_USERNAME)) -and (-not [string]::IsNullOrWhiteSpace($env:C189_PASSWORD))
          if (-not $hasConfig -and -not $hasPwd) {
            Write-Warning "Cloud189 credentials are empty."
            echo "C189_LINK=" >> $env:GITHUB_ENV
            exit 0
          }
          $cfg = Join-Path $env:RUNNER_TEMP "c189.json"
          $c189 = $env:C189_CLI
          $remotePath = "$env:C189_DIR/$($isoFile.Name)"
          $link = ""
          $uploaded = $false
          try {
            if ($hasConfig) {
              $raw = $env:C189_CONFIG.Trim()
              if (-not $raw.StartsWith('{')) { $raw = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($raw)) }
            } else {
              $raw = @{ user = @{ name = $env:C189_USERNAME; password = $env:C189_PASSWORD } } | ConvertTo-Json -Compress
            }
            # 凭据只落到临时文件, 不打印, 步骤结束即删除
            Set-Content -Path $cfg -Value $raw -Encoding utf8 -NoNewline

            Write-Host "Cloud189: 上传 $($isoFile.Name) ($([math]::Round($isoFile.Length / 1GB, 2)) GB) -> $remotePath"
            $upOut = & $c189 up --config "$cfg" --json --input "$($isoFile.FullName)" --path "$remotePath" --policy overwrite --parallel 64 2>&1
            $upCode = $LASTEXITCODE
            $upText = ($upOut | Out-String).Trim()
            if ($upText) { Write-Host $upText }
            $upJson = $upOut | Where-Object { "$_".TrimStart().StartsWith('{') } | Select-Object -Last 1
            if ($upCode -ne 0) {
              $reason = if ($upJson) { ($upJson | ConvertFrom-Json).error } else { $upText }
              throw "cloud189 up 失败: $reason"
            }
            if (-not $upJson) { throw "cloud189 up 未返回 JSON: $upText" }
            $up = $upJson | ConvertFrom-Json
            if (-not $up.file_id) { throw "cloud189 up 未返回 file_id: $upText" }
            $uploaded = $true

            # 永久公开分享, --reuse 复用已有分享, 重跑不消耗当日分享次数
            $shOut = & $c189 link --config "$cfg" --json --file-id "$($up.file_id)" --public --expire 2099 --reuse 2>&1
            $shCode = $LASTEXITCODE
            $shText = ($shOut | Out-String).Trim()
            if ($shText) { Write-Host $shText }
            $shJson = $shOut | Where-Object { "$_".TrimStart().StartsWith('{') } | Select-Object -Last 1
            if ($shCode -ne 0) {
              $reason = if ($shJson) { ($shJson | ConvertFrom-Json).error } else { $shText }
              if ("$reason" -match '当日分享次数已达上限|ShareCreateOverload') {
                Write-Warning "Cloud189: 当日分享次数已达上限, 文件已上传到 $remotePath, 本次不生成分享链接。"
              } else {
                throw "cloud189 link 失败: $reason"
              }
            } else {
              if (-not $shJson) { throw "cloud189 link 未返回 JSON: $shText" }
              $share = $shJson | ConvertFrom-Json
              if (-not $share.url) { throw "cloud189 link 未返回分享链接: $shText" }
              $link = $share.url
              if ($share.access_code) { $link = "$($share.url) (提取码: $($share.access_code))" }
            }
          } catch {
            Write-Warning "Cloud189 upload failed: $_"
          } finally {
            # 会话与账号信息都在该文件里, 无论成败都删掉
            Remove-Item $cfg -Force -ErrorAction SilentlyContinue
          }
          echo "C189_LINK=$link" >> $env:GITHUB_ENV
          if ($uploaded) { echo "C189_PATH=$remotePath" >> $env:GITHUB_ENV }

      - name: Build summary
        id: build_summary
        shell: pwsh
        run: |
          $outputDir = "${{ inputs.architecture == 'arm64' && 'C:/output' || 'D:/output' }}"
          $jsonPath = Get-ChildItem -Path $outputDir -Filter "*.iso.json" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $jsonPath) {
            $jsonPath = Get-ChildItem -Path $outputDir -Filter "*.json" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $jsonPath) {
            Write-Error "ISO metadata JSON file not found."
            exit 1
          }

          $iso = Get-Content $jsonPath.FullName | ConvertFrom-Json
          $imageNames = $iso.images | ForEach-Object { $_.name }
          if ($imageNames.Count -gt 1) {
            if ($imageNames[0] -match '^(Windows (10|11))\s*(.*)') {
              $prefix = $matches[1]
              $first = $imageNames[0]
              $rest = $imageNames[1..($imageNames.Count - 1)] | ForEach-Object { ($_ -replace "^$prefix\s*", '') }
              $finalImageName = $first + '/' + ($rest -join '/')
            } else {
              $finalImageName = $imageNames -join '/'
            }
          } else {
            $finalImageName = $imageNames
          }

          $opts = '${{ steps.map.outputs.options }}'
          $optsRow = $null
          if (-not [string]::IsNullOrWhiteSpace($opts)) {
            $descMap = @{
              '-esd'     = 'Use ESD compression'
              '-drivers' = 'Add additional drivers'
              '-netfx3'  = 'Add .NET Framework 3.5'
            }
            $tokens = @($opts -split '\s+' | Where-Object { $_ -and $_.Trim() -ne '' })
            $items = @()
            for ($i = 0; $i -lt $tokens.Count; $i++) {
              $k = $tokens[$i].ToLower()
              if ($k -eq '-revision') {
                $i++
                if ($i -lt $tokens.Count) { $items += 'Revision: ' + $tokens[$i].Trim('"', "'") }
              }
              elseif ($descMap.ContainsKey($k)) { $items += $descMap[$k] }
              else { $items += $tokens[$i].TrimStart('-') }
            }
            $items = @($items | Select-Object -Unique)

            if ($items.Count -gt 0) {
              $optsFormatted = ($items | ForEach-Object { "<li>$($_)</li>" }) -join ''
              $optsRow = "| Build config | <ul>$optsFormatted</ul> |"
            }
          }

          $isoFile = Get-ChildItem -Path $outputDir -Filter "*.ISO" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          $isoName = if ($isoFile) { $isoFile.Name } else { $env:ISO_NAME + '.ISO' }
          $isoSize = if ($isoFile) { [math]::Round($isoFile.Length / 1GB, 2).ToString() + ' GB (' + $isoFile.Length + ' bytes)' } else { 'Unknown' }

          Add-Content $env:GITHUB_STEP_SUMMARY @"
          ### FILE INFO:
          | Property | Value |
          | :--- | :--- |
          | Name | $finalImageName $($iso.version) |
          | Build | $($iso.build) |
          | Architecture | ${{ inputs.architecture }} |
          | Language | ${{ inputs.language }} |
          | ISO file | $isoName |
          | ISO size | $isoSize |
          "@

          if ($optsRow) {
            Add-Content $env:GITHUB_STEP_SUMMARY $optsRow
          }

          Add-Content $env:GITHUB_STEP_SUMMARY @"
          | SHA256 | $($iso.checksum) |
          | UUP dump | [$($iso.title)]($($iso.uupDump.downloadUrl)) |
          "@

          $cloudMd = "`n### CLOUD DOWNLOAD LINKS:`n| Mirror | Link |`n| :--- | :--- |`n"
          $hasCloud = $false
          if ($env:GOFILE_LINK) {
            $cloudMd += "| Gofile | $($env:GOFILE_LINK) |`n"
            $hasCloud = $true
          }
          if ($env:PIXELDRAIN_LINK) {
            $cloudMd += "| Pixeldrain | $($env:PIXELDRAIN_LINK) |`n"
            $hasCloud = $true
          }
          if ($env:BUZZHEAVIER_LINK) {
            $cloudMd += "| Buzzheavier | $($env:BUZZHEAVIER_LINK) |`n"
            $hasCloud = $true
          }
          if ($env:QUARK_LINK) {
            $cloudMd += "| Quark | $($env:QUARK_LINK) |`n"
            $hasCloud = $true
          }
          if ($env:C189_LINK) {
            $cloudMd += "| 天翼云盘 | $($env:C189_LINK) |`n"
            $hasCloud = $true
          } elseif ($env:C189_PATH) {
            $cloudMd += "| 天翼云盘 | 已上传到 ``$($env:C189_PATH)``, 未生成分享链接 |`n"
            $hasCloud = $true
          }
          if (-not $hasCloud) {
            $cloudMd += "| None | Upload failed or disabled |`n"
          }
          Add-Content $env:GITHUB_STEP_SUMMARY $cloudMd

          $rlsnfo = @"

          ## RELEASE INFO
          > [!NOTE]
          > ISO file is uploaded to enabled cloud drives only.
          > GitHub Release stores the metadata and cloud download links.

          > [!TIP]
          > If one mirror is unavailable, use another mirror listed above.
          "@

          ((Get-Content $env:GITHUB_STEP_SUMMARY) + "<br/>" + $rlsnfo) | Set-Content summary.md
          echo "build=$($iso.build)" >> $env:GITHUB_ENV
          echo "version=$($iso.version)" >> $env:GITHUB_ENV
          echo "name=$($iso.name)" >> $env:GITHUB_ENV
          echo "title=$($iso.title)" >> $env:GITHUB_ENV
          echo "images=$($finalImageName)" >> $env:GITHUB_ENV
          echo "iso_checksum=$($iso.checksum)" >> $env:GITHUB_ENV
          echo "tagname=$($iso.build).$($iso.version).${{ fromJSON('{"Pro":"PRO","Home":"HOME","Multi":"MULTI"}')[inputs.edition] }}.${{ fromJSON('{"x64":"X64","arm64":"ARM64"}')[inputs.architecture] }}.${{ fromJSON('{"ar-sa":"AR","bg-bg":"BG","cs-cz":"CS","da-dk":"DA","de-de":"DE","el-gr":"EL","en-gb":"EN","en-us":"EN","es-es":"ES","es-mx":"ES","et-ee":"ET","fi-fi":"FI","fr-ca":"FR","fr-fr":"FR","he-il":"HE","hr-hr":"HR","hu-hu":"HU","it-it":"IT","ja-jp":"JA","ko-kr":"KO","lt-lt":"LT","lv-lv":"LV","nb-no":"NB","nl-nl":"NL","pl-pl":"PL","pt-br":"PT","pt-pt":"PT","ro-ro":"RO","ru-ru":"RU","sk-sk":"SK","sl-si":"SL","sr-latn-rs":"SR","sv-se":"SV","th-th":"TH","tr-tr":"TR","uk-ua":"UK","zh-cn":"ZH","zh-tw":"ZH"}')[steps.map.outputs.lang] }}$($iso.tags)" >> $env:GITHUB_ENV

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "${{ env.tagname }}"
          name: "${{ env.images }} ${{ inputs.architecture }} ${{ env.version }} (${{ env.build }})"
          body_path: summary.md
          draft: false
          prerelease: ${{ !contains(fromJson('["Windows 10 22H2","Windows 11 23H2","Windows 11 24H2","Windows 11 25H2","Windows 11 26H1","Windows 11 26H2"]'), inputs.versions) }}